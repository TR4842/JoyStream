name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.JOYSTREAM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JOYSTREAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JOYSTREAM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JOYSTREAM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "path=$RUNNER_TEMP/release.jks"
              echo "store_password=$KEYSTORE_PASSWORD"
              echo "alias=$KEY_ALIAS"
              echo "key_password=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_OUTPUT"
            echo "Using keystore from repository secrets."
          else
            {
              echo "path=$GITHUB_WORKSPACE/keystore/joystream-dev.jks"
              echo "store_password=joystream"
              echo "alias=joystream"
              echo "key_password=joystream"
            } >> "$GITHUB_OUTPUT"
            echo "Using the bundled development keystore (see README → Signing)."
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble APKs
        env:
          JOYSTREAM_KEYSTORE: ${{ steps.signing.outputs.path }}
          JOYSTREAM_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          JOYSTREAM_KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          JOYSTREAM_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/joystream-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/joystream-${VERSION}-debug.apk"
          ls -lh artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joystream-apks
          path: artifacts/*.apk
          retention-days: 30

      - name: Attach APKs to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
