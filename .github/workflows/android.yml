name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub release with the built APKs"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/platforms" || true

      - name: Configure signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.JOYSTREAM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JOYSTREAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JOYSTREAM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JOYSTREAM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "path=$RUNNER_TEMP/release.jks"
              echo "store_password=$KEYSTORE_PASSWORD"
              echo "alias=$KEY_ALIAS"
              echo "key_password=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_OUTPUT"
            echo "Using keystore from repository secrets."
          else
            {
              echo "path=$GITHUB_WORKSPACE/keystore/joystream-dev.jks"
              echo "store_password=joystream"
              echo "alias=joystream"
              echo "key_password=joystream"
            } >> "$GITHUB_OUTPUT"
            echo "Using the bundled development keystore (see README → Signing)."
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee -a build.log

      - name: Assemble APKs
        env:
          JOYSTREAM_KEYSTORE: ${{ steps.signing.outputs.path }}
          JOYSTREAM_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          JOYSTREAM_KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          JOYSTREAM_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee -a build.log

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f build.log ]; then
            tail -c 60000 build.log > failure-tail.log || true
            jq -Rs '{body: ("CI build failure\n\n```\n" + . + "\n```")}' failure-tail.log > payload.json
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input payload.json || true
          fi

      - name: Collect APKs
        run: |
          set -euo pipefail
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/joystream-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/joystream-${VERSION}-debug.apk"
          ls -lh artifacts

      - name: Verify APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          BADGING=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          SIGNABLE=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          {
            echo "**APK verification** (expected version ${BUILD_VERSION})"
            echo
            echo '```'
            sha256sum "$APK"
            if [ -n "$BADGING" ]; then "$BADGING" dump badging "$APK" | head -4; fi
            if [ -n "$SIGNABLE" ]; then "$SIGNABLE" verify --print-certs "$APK" | head -6; fi
            echo '```'
          } > verify.md
          cat verify.md
          jq -Rs '{body: .}' verify.md > payload.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input payload.json || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joystream-apks
          path: artifacts/*.apk
          retention-days: 30

      - name: Publish manual release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          {
            echo "Native Android client for MovieBox-Tui."
            echo
            echo "- Stream movies, series and live TV"
            echo "- Resumable offline downloads"
            echo "- Self-updating in app (this release is the update feed)"
            echo
            echo "Install \`joystream-${VERSION}.apk\` and allow installs from unknown sources."
          } > notes.md
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" artifacts/*.apk --clobber
          else
            gh release create "v${VERSION}" \
              --title "JoyStream v${VERSION}" \
              --notes-file notes.md \
              artifacts/*.apk
          fi

      - name: Attach APKs to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
